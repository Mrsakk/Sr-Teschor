      (function() {

        // 1. Patch Node.prototype.insertBefore
        var origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {

      // 4. Global Khmer Numerals to Latin Digits Enforcer (Keep all numbers as 0-9)
      (function() {
        var khmerDigitMap = {
          '\u17E0': '0', '\u17E1': '1', '\u17E2': '2', '\u17E3': '3', '\u17E4': '4',
          '\u17E5': '5', '\u17E6': '6', '\u17E7': '7', '\u17E8': '8', '\u17E9': '9'
        };
        var khmerDigitRegex = /[\u17E0-\u17E9]/g;
        
        function replaceKhmerDigitsInNode(node) {
          if (!node) return;
          if (node.nodeType === 3) { // TEXT_NODE
            if (node.nodeValue && khmerDigitRegex.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue.replace(khmerDigitRegex, function(m) {
                return khmerDigitMap[m] || m;
              });
            }
          } else if (node.nodeType === 1) { // ELEMENT_NODE
            var tag = node.tagName;
            if (tag === 'SCRIPT' || tag === 'STYLE') return;
            for (var child = node.firstChild; child; child = child.nextSibling) {

        var isProcessing = false;
        var observer = new MutationObserver(function(mutations) {
          if (isProcessing) return;

        } else if (document.body) {

        // 5. Browser Tab Title Protection (Prevent title from being translated)
