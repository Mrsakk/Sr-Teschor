    <!-- Google Translate & Browser Extension DOM Reconciliation Shield -->
    <script>
      (function() {
        if (typeof window === 'undefined' || typeof Node === 'undefined' || !Node.prototype) return;
        
        // 1. Patch Node.prototype.insertBefore
        var origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (referenceNode.parentNode && typeof referenceNode.parentNode.insertBefore === 'function') {
              try {
                return referenceNode.parentNode.insertBefore(newNode, referenceNode);
              } catch (e) {}
            }
            try {
              return this.appendChild(newNode);
            } catch (e) {
              return newNode;
            }
          }
          try {
            return origInsertBefore.apply(this, arguments);
          } catch (e) {
            try {
              return this.appendChild(newNode);
            } catch (err) {
              return newNode;
            }
          }
        };

        // 2. Patch Node.prototype.removeChild
        var origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (!child) return child;
          if (child.parentNode !== this) {
            if (child.parentNode && typeof child.parentNode.removeChild === 'function') {
              try {
                return child.parentNode.removeChild(child);
              } catch (e) {
                return child;
              }
            }
            return child;
          }
          try {
            return origRemoveChild.apply(this, arguments);
          } catch (e) {
            if (child.parentNode && typeof child.parentNode.removeChild === 'function') {
              try {
                return child.parentNode.removeChild(child);
              } catch (err) {
                return child;
              }
            }
            return child;
          }
        };

        // 3. Patch Node.prototype.replaceChild
        var origReplaceChild = Node.prototype.replaceChild;
        if (origReplaceChild) {
          Node.prototype.replaceChild = function(newChild, oldChild) {
            if (!oldChild) {
              try { return this.appendChild(newChild); } catch (e) { return newChild; }
            }
            if (oldChild.parentNode !== this) {
              if (oldChild.parentNode && typeof oldChild.parentNode.replaceChild === 'function') {
                try {
                  return oldChild.parentNode.replaceChild(newChild, oldChild);
                } catch (e) {}
              }
              try { return this.appendChild(newChild); } catch (e) { return newChild; }
            }
            try {
              return origReplaceChild.apply(this, arguments);
            } catch (e) {
              try {
                return this.appendChild(newChild);
              } catch (err) {
                return newChild;
              }
            }
          };
        }
      })();

    <!-- Auto Default to Khmer (KM) if no language cookie is set -->
    <script type="text/javascript">
      (function() {
        if (!document.cookie.includes('googtrans=')) {
          document.cookie = 'googtrans=/en/km; path=/';
          document.cookie = 'googtrans=/en/km; domain=' + window.location.hostname + '; path=/';
        }
      })();
    </script>
    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          try {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'km,en,zh-CN,fr,ko,ja,th,vi',
              autoDisplay: false
            }, 'google_translate_element');
          } catch (e) {
            // Graceful fallback if translate is blocked by client
          }

    </script>
